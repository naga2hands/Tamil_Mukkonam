<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tamil Letter Triangle</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@400;500;700&family=Inter:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="top-bar">
        <div class="top-panel">
          <h2>UYIR ELUTHUKKAL</h2>
          <div id="uyir-list" class="letter-stack" aria-label="Uyir letters"></div>
        </div>

        <div class="top-panel">
          <h2>MEY ELUTHUKKAL</h2>
          <div id="mey-list" class="letter-stack" aria-label="Mey letters"></div>
        </div>
      </header>

      <main class="main-learning">
        <div class="board-row">
          <div class="triangle-scene" aria-label="Tamil letter triangle board">
            <svg class="triangle-outline outer-triangle" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
              <polygon points="50,-23 -25,100 125,100" />
            </svg>
            <svg class="triangle-outline middle-triangle" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
              <polygon points="50,3 4,83 96,83" />
            </svg>
            <svg class="triangle-outline middle-triangle" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
              <polygon points="50,34 30,66 70,66" />
            </svg>
            <div class="triangle-layer outer-layer" aria-hidden="true"></div>
            <div class="triangle-layer middle-layer" aria-hidden="true"></div>
            <div id="center-letter" class="center-letter">க</div>
          </div>

          <div class="aytham-wrap" aria-label="Aytham letter">
            <div class="small-triangle"><span>ஃ</span></div>
          </div>
        </div>

        <div class="equation-panel">
          <p class="equation-label">MEY + UYIR = UYIRMEI</p>
          <p id="equation-text" class="equation-text"><span class="sequence">க</span> + <span class="sequence">அ</span> = <span class="result">க</span></p>
        </div>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
